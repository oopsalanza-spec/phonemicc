name: Build PC Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "pc/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r pc/requirements.txt pyinstaller

      - name: Build receiver.exe
        run: |
          cd pc
          pyinstaller --onefile --noconsole --name receiver receiver.py
          mkdir installer_files
          copy dist\receiver.exe installer_files\receiver.exe

      - name: Download VB-Cable driver
        run: |
          cd pc
          curl -L -o installer_files\VBCABLE_Driver_Pack.zip https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip
          powershell -Command "Expand-Archive -Path installer_files\VBCABLE_Driver_Pack.zip -DestinationPath installer_files\vbcable"
          copy installer_files\vbcable\VBCABLE_Setup_x64.exe installer_files\VBCABLE_Setup_x64.exe

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        run: |
          cd pc
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-Setup
          path: pc/dist_installer/PhoneMic-Setup.exe
